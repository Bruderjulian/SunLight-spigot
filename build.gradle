plugins {
    // Applied by the version-specific NMS modules; declared here only to pin a
    // single version across the build.
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.24" apply(false)
}

allprojects {
    group = 'su.nightexpress.sunlight'
    version = '4.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.nightexpressdev.com/releases' }
        maven { url = 'https://repo.dmulloy2.net/repository/public/' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://maven.enginehub.org/repo/' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
        maven { url = 'https://nexus.scarsz.me/content/groups/public/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    // Applied so every module shares one publishing-repository definition below.
    // Publications themselves are only declared by the modules that are meant to
    // be consumed externally (API and Core).
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
        //withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        // Unpinnable by nature, so keep them in sync deliberately:
        //  - su.nightexpress.nightcore:main:* tracks a moving branch, meaning the
        //    compile classpath can change without any change in this repo.
        //  - ProtocolLib 5.4.0-SNAPSHOT is the only ProtocolLib build the
        //    optional packet hooks can target.
        //  - The 1.21.11 paper dev bundle is a SNAPSHOT because that is how Paper
        //    publishes dev bundles.
        compileOnly 'su.nightexpress.nightcore:main:2.16.4'
        // Pinned, not '26.1.2.build.+': a dynamic version lets an unchanged
        // checkout compile against a different paper-api without a diff.
        compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
        compileOnly 'com.comphenix.protocol:ProtocolLib:5.4.0-SNAPSHOT'
        compileOnly 'com.github.retrooper:packetevents-spigot:2.12.0'
        compileOnly 'com.discordsrv:discordsrv:1.28.0'
        compileOnly 'me.clip:placeholderapi:2.11.6'
        compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.13') { transitive = false }
        compileOnly('com.sk89q.worldguard:worldguard-core:7.0.13') { transitive = false }
        compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.3.15') { transitive = false }
        compileOnly('com.sk89q.worldedit:worldedit-core:7.3.15') { transitive = false }
        compileOnly 'com.github.TechFortress:GriefPrevention:16.18'
        compileOnly 'org.apache.commons:commons-text:1.10.0'
        compileOnly 'net.luckperms:api:5.5'
        compileOnly('com.github.NEZNAMY:TAB-API:6.1.2') { transitive = false }
    }

    publishing {
        repositories {
            maven {
                name = "nightexpress"
                url = uri("https://repo.nightexpressdev.com/releases")
                credentials {
                    username = System.getenv("REPOSILITE_USER")
                    password = System.getenv("REPOSILITE_PASSWORD")
                }
            }
        }
    }
}

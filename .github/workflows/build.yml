name: Build

on:
  push:
  pull_request:

# Publishing is deliberately absent: it needs the Reposilite credentials, which
# live in the local environment rather than in CI. Publish with a local
# `./gradlew publish` when a release is intended.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify the published POMs
        run: ./gradlew publishToMavenLocal

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: SunLight
          path: target/SunLight-*.jar
          if-no-files-found: error

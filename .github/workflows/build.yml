name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify the published POMs
        run: ./gradlew publishToMavenLocal

      - name: Resolve built jar
        id: jar
        run: |
          set -- target/*.jar
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one jar in target/, found $#"
            exit 1
          fi
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$1" .jar)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 4

# Paperweight patches a ~21MB server jar per dev-bundle module, so the daemon
# needs more headroom than the defaults give it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# The build is a 5-module graph with two paperweight dev-bundle setups in it;
# there is nothing to gain from serialising the projects.
org.gradle.parallel=true

org.gradle.caching=true

# paperweight 2.x supports the configuration cache, and it becomes the only mode
# in Gradle 10. 'warn' first so an incompatibility degrades instead of failing;
# tighten to 'fail' once the build reports no problems.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
